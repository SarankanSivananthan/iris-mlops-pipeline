name: Docker Publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest

  build-and-push:
    needs: test
    # Pull requests only run the tests; deployment happens on pushes to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Run Hadolint
      run: docker run --rm -i hadolint/hadolint < Dockerfile
      continue-on-error: true

    - name: 'Login via Azure CLI'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: az acr login --name ${{ secrets.REGISTRY_LOGIN_SERVER }}

    - name: Build and push image
      run: |
        docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/iris-predictor:v1
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/iris-predictor:v1

    - name: Create Azure container environment
      run: az containerapp env create -n iris-predictor-container-env -g ${{ secrets.RESOURCE_GROUP }} --location francecentral

    - name: Deploy to Azure Container
      run: |
        az containerapp create --resource-group ${{ secrets.RESOURCE_GROUP }} --name iris-predictor-container --image ${{ secrets.REGISTRY_LOGIN_SERVER }}/iris-predictor:v1 --cpu 1 --memory 2 --registry-server ${{ secrets.REGISTRY_LOGIN_SERVER }} --registry-username ${{ secrets.REGISTRY_USERNAME }} --registry-password ${{ secrets.REGISTRY_PASSWORD }} --ingress external --target-port 5000 --environment iris-predictor-container-env
    
    - name: Configure autoscaling
      run: |
        az containerapp update \
          --name iris-predictor-container \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --scale-rule-name http-scale-rule \
          --scale-rule-http-concurrency 5 \
          --min-replicas 1 \
          --max-replicas 10